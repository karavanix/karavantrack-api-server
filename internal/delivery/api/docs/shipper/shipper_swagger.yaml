basePath: /api/v1
definitions:
  command.AddCarrierRequest:
    properties:
      alias:
        type: string
      carrier_id:
        type: string
    required:
    - alias
    - carrier_id
    type: object
  command.AddMemberRequest:
    properties:
      alias:
        type: string
      role:
        enum:
        - admin
        - member
        type: string
      user_id:
        type: string
    required:
    - alias
    - role
    - user_id
    type: object
  command.AppleSignInRequest:
    properties:
      authorization_code:
        description: |-
          AuthorizationCode from the same sign-in: traded for Apple's refresh
          token, which is revoked when the account is deleted.
        type: string
      first_name:
        type: string
      id_token:
        type: string
      last_name:
        type: string
      role:
        type: string
    required:
    - id_token
    type: object
  command.AppleSignInResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: ExpiresIn is the access token's lifetime in seconds.
        type: integer
      is_new_user:
        type: boolean
      refresh_token:
        type: string
      role:
        type: string
    type: object
  command.AssignRequest:
    properties:
      attachment_ids:
        items:
          type: string
        type: array
      carrier_id:
        type: string
      note:
        type: string
    required:
    - carrier_id
    type: object
  command.CreateInviteLinkResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
      url:
        type: string
    type: object
  command.CreateTrackingLinkResponse:
    properties:
      token:
        type: string
      url:
        type: string
    type: object
  command.GeneratePKCEResponse:
    properties:
      code_challenge:
        type: string
      state:
        type: string
    type: object
  command.InviteRequest:
    properties:
      contact:
        type: string
      role:
        type: string
    required:
    - contact
    - role
    type: object
  command.InviteResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      phone:
        type: string
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  command.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
      phone:
        type: string
    type: object
  command.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: ExpiresIn is the access token's lifetime in seconds.
        type: integer
      refresh_token:
        type: string
    type: object
  command.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  command.RegisterDeviceRequest:
    properties:
      device_id:
        type: string
      device_name:
        type: string
      device_token:
        type: string
      device_type:
        type: string
    required:
    - device_id
    - device_token
    type: object
  command.RegisterRequest:
    properties:
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        type: string
      phone:
        type: string
      role:
        enum:
        - shipper
        - carrier
        type: string
    required:
    - password
    - role
    type: object
  command.TelegramOAuthRequest:
    properties:
      code:
        type: string
      redirect_uri:
        type: string
      role:
        type: string
      state:
        type: string
    type: object
  command.TelegramSignInRequest:
    properties:
      id_token:
        type: string
      role:
        type: string
    required:
    - id_token
    type: object
  command.TelegramSignInResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: ExpiresIn is the access token's lifetime in seconds.
        type: integer
      is_new_user:
        type: boolean
      refresh_token:
        type: string
      role:
        type: string
    type: object
  command.UploadFileResponse:
    properties:
      createdAt:
        type: string
      filename:
        type: string
      id:
        type: string
      mimeType:
        type: string
      publicURL:
        type: string
      status:
        type: string
      visibility:
        type: string
    type: object
  command.UploadImageResponse:
    properties:
      createdAt:
        type: string
      filename:
        type: string
      id:
        type: string
      mimeType:
        type: string
      publicURL:
        type: string
      status:
        type: string
      visibility:
        type: string
    type: object
  command.VerifyEmailRequest:
    properties:
      code:
        type: string
      email:
        type: string
    required:
    - code
    - email
    type: object
  command.VerifyEmailResponse:
    properties:
      access_token:
        type: string
      expires_in:
        description: ExpiresIn is the access token's lifetime in seconds.
        type: integer
      refresh_token:
        type: string
      role:
        type: string
    type: object
  common.submitLeadRequest:
    properties:
      company:
        type: string
      fleet:
        type: string
      honeypot:
        type: string
      name:
        type: string
      phone:
        type: string
    type: object
  github_com_karavanix_karavantrack-api-server_internal_usecase_companies_command.CreateRequest:
    properties:
      name:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - name
    type: object
  github_com_karavanix_karavantrack-api-server_internal_usecase_companies_command.CreateResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  github_com_karavanix_karavantrack-api-server_internal_usecase_companies_command.UpdateRequest:
    properties:
      name:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - name
    type: object
  github_com_karavanix_karavantrack-api-server_internal_usecase_loads_command.CreateRequest:
    properties:
      company_id:
        type: string
      description:
        type: string
      dropoff_address:
        type: string
      dropoff_at:
        type: string
      dropoff_lat:
        type: number
      dropoff_lng:
        type: number
      pickup_address:
        type: string
      pickup_at:
        type: string
      pickup_lat:
        type: number
      pickup_lng:
        type: number
      reference_id:
        type: string
      title:
        maxLength: 255
        minLength: 2
        type: string
    required:
    - company_id
    - dropoff_lat
    - dropoff_lng
    - pickup_lat
    - pickup_lng
    - title
    type: object
  github_com_karavanix_karavantrack-api-server_internal_usecase_loads_command.CreateResponse:
    properties:
      id:
        type: string
      status:
        type: string
    type: object
  github_com_karavanix_karavantrack-api-server_internal_usecase_users_command.UpdateRequest:
    properties:
      first_name:
        type: string
      last_name:
        type: string
    type: object
  outerr.Response:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  query.AttachmentResponse:
    properties:
      createdAt:
        type: string
      filename:
        type: string
      id:
        type: string
      mimeType:
        type: string
      publicURL:
        type: string
      status:
        type: string
      visibility:
        type: string
    type: object
  query.CompanyResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      owner_id:
        type: string
      permissions:
        items:
          type: string
        type: array
      role:
        type: string
      status:
        type: string
    type: object
  query.ConnectionStatusResponse:
    properties:
      battery_level:
        description: |-
          BatteryLevel of the driver's phone, 0..1, and whether it's charging,
          as of the latest point that reported them.
        type: number
      is_charging:
        type: boolean
      last_point_at:
        type: string
      reason:
        enum:
        - location_off
        - permission_denied
        type: string
      since:
        description: 'Since: when the truck stopped (stopped) or GPS went off (gps_disabled).'
        type: string
      state:
        description: |-
          State: not_started (the load isn't tracked), moving, stopped (since
          Since; the phone sends nothing while standing), no_data (no fresh
          point while not standing) or gps_disabled (Android reported location
          services off or the permission gone; Reason says which).
        enum:
        - not_started
        - moving
        - stopped
        - no_data
        - gps_disabled
        type: string
    type: object
  query.GetCarrierByContactResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      is_free:
        type: boolean
      last_name:
        type: string
      phone:
        type: string
      role:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  query.GetInviteResponse:
    properties:
      accepted_by_me:
        type: boolean
      load:
        $ref: '#/definitions/query.InviteLoadPreview'
      load_id:
        type: string
      status:
        type: string
    type: object
  query.GetPublicTrackingResponse:
    properties:
      connection:
        $ref: '#/definitions/query.ConnectionStatusResponse'
      load:
        $ref: '#/definitions/query.PublicTrackingLoad'
      position:
        $ref: '#/definitions/query.PublicPosition'
    type: object
  query.GetRouteResponse:
    properties:
      distance_m:
        description: DistanceM is the distance driven along roads; gaps aren't counted.
        type: number
      load_id:
        type: string
      matched_until:
        description: |-
          MatchedUntil is when the last point covered by the route was
          recorded; points after it are drawn raw up to the live marker.
        type: string
      segments:
        items:
          $ref: '#/definitions/query.RouteSegmentResponse'
        type: array
      updated_at:
        type: string
    type: object
  query.GetShipperByContactResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      phone:
        type: string
      role:
        type: string
      updated_at:
        type: string
    type: object
  query.GetStatsResponse:
    properties:
      accepted:
        type: integer
      assigned:
        type: integer
      canceled:
        type: integer
      confirmed:
        type: integer
      created:
        type: integer
      dropped_off:
        type: integer
      dropping_off:
        type: integer
      in_transit:
        type: integer
      picked_up:
        type: integer
      picking_up:
        type: integer
      total:
        type: integer
    type: object
  query.GetTrackResponse:
    properties:
      load_id:
        type: string
      points:
        description: Points are oldest first.
        items:
          $ref: '#/definitions/query.TrackPointResponse'
        type: array
    type: object
  query.HistoryAttachmentResponse:
    properties:
      attachment_id:
        type: string
      created_at:
        type: string
      history_id:
        type: integer
      id:
        type: integer
      url:
        description: |-
          URL is best-effort: a public attachment's stable URL, or a short-lived
          presigned URL for a private one. Omitted if it could not be resolved
          (see attachmentURLResolver) — the client still has AttachmentID and can
          fall back to GET /attachments/{id}.
        type: string
    type: object
  query.HistoryResponse:
    properties:
      attachments:
        items:
          $ref: '#/definitions/query.HistoryAttachmentResponse'
        type: array
      created_at:
        type: string
      from_status:
        type: string
      id:
        type: integer
      note:
        type: string
      to_status:
        type: string
      user_id:
        type: string
    type: object
  query.InviteLoadPreview:
    properties:
      company_name:
        type: string
      dropoff_address:
        type: string
      dropoff_at:
        type: string
      pickup_address:
        type: string
      pickup_at:
        type: string
      reference_id:
        type: string
      title:
        type: string
    type: object
  query.ListCarriersResponse:
    properties:
      alias:
        type: string
      carrier_id:
        type: string
      created_at:
        type: string
      first_name:
        type: string
      is_free:
        type: boolean
      last_name:
        type: string
      status:
        type: string
    type: object
  query.LoadDetailResponse:
    properties:
      carrier_id:
        type: string
      company_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      dropoff_address:
        type: string
      dropoff_at:
        type: string
      dropoff_lat:
        type: number
      dropoff_lng:
        type: number
      history:
        items:
          $ref: '#/definitions/query.HistoryResponse'
        type: array
      id:
        type: string
      member_id:
        type: string
      pickup_address:
        type: string
      pickup_at:
        type: string
      pickup_lat:
        type: number
      pickup_lng:
        type: number
      reference_id:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  query.LoadResponse:
    properties:
      carrier_id:
        type: string
      company_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      dropoff_address:
        type: string
      dropoff_at:
        type: string
      dropoff_lat:
        type: number
      dropoff_lng:
        type: number
      id:
        type: string
      member_id:
        type: string
      pickup_address:
        type: string
      pickup_at:
        type: string
      pickup_lat:
        type: number
      pickup_lng:
        type: number
      reference_id:
        type: string
      status:
        type: string
      title:
        type: string
      updated_at:
        type: string
    type: object
  query.MeResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      phone:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  query.MemberResponse:
    properties:
      alias:
        type: string
      company_id:
        type: string
      created_at:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      member_id:
        type: string
      role:
        type: string
    type: object
  query.PositionResponse:
    properties:
      accuracy_m:
        type: number
      carrier_id:
        type: string
      heading_deg:
        type: number
      lat:
        type: number
      lng:
        type: number
      load_id:
        type: string
      recorded_at:
        type: string
      speed_mps:
        type: number
    type: object
  query.PreviewRouteResponse:
    properties:
      distance_m:
        type: number
      duration_s:
        type: number
      geometry:
        description: Geometry is a polyline6 string (@mapbox/polyline, precision 6).
        type: string
    type: object
  query.PublicPosition:
    properties:
      heading_deg:
        type: number
      lat:
        type: number
      lng:
        type: number
      recorded_at:
        type: string
      speed_mps:
        type: number
    type: object
  query.PublicTrackPoint:
    properties:
      address:
        type: string
      at:
        type: string
      lat:
        type: number
      lng:
        type: number
    type: object
  query.PublicTrackingLoad:
    properties:
      dropoff:
        $ref: '#/definitions/query.PublicTrackPoint'
      pickup:
        $ref: '#/definitions/query.PublicTrackPoint'
      reference_id:
        type: string
      status:
        type: string
      title:
        type: string
    type: object
  query.RouteSegmentResponse:
    properties:
      distance_m:
        type: number
      ended_at:
        type: string
      geometry:
        description: Geometry is a polyline6 string (@mapbox/polyline, precision 6).
        type: string
      kind:
        description: |-
          Kind: matched (along roads, solid line), raw (the matcher couldn't
          place it: raw GPS line, thin), gap (no data: straight dashed line),
          stop (a single point: stop marker).
        enum:
        - matched
        - raw
        - gap
        - stop
        type: string
      started_at:
        type: string
    type: object
  query.TrackPointResponse:
    properties:
      accuracy_m:
        type: number
      heading_deg:
        type: number
      lat:
        type: number
      lng:
        type: number
      recorded_at:
        type: string
      speed_mps:
        type: number
      status_event:
        $ref: '#/definitions/query.TrackStatusEvent'
    type: object
  query.TrackStatusEvent:
    properties:
      from_status:
        type: string
      history_id:
        type: integer
      note:
        type: string
      to_status:
        type: string
    type: object
info:
  contact: {}
  title: Shippers API
paths:
  /attachments/{id}:
    get:
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/query.AttachmentResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/outerr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/outerr.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/outerr.Response'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/outerr.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/outerr.Response'
      security:
      - ApiKeyAuth: []
      summary: Get attachment metadata
      tags:
      - Attachments
  /attachments/{id}/download:
    get:
      parameters:
      - description: Attachment ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/outerr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/outerr.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/outerr.Response'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/outerr.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/outerr.Response'
      security:
      - ApiKeyAuth: []
      summary: Download attachment file
      tags:
      - Attachments
  /attachments/file:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: File to upload
        in: formData
        name: file
        required: true
        type: file
      - description: Visibility of attachment
        in: formData
        name: visibility
        required: true
        type: string
      - description: Folder to upload attachment
        in: formData
        name: folder
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/command.UploadFileResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/outerr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/outerr.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/outerr.Response'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/outerr.Response'
        "413":
          description: Request entity too large
          schema:
            $ref: '#/definitions/outerr.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/outerr.Response'
      security:
      - ApiKeyAuth: []
      summary: Upload attachment
      tags:
      - Attachments
  /attachments/image:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Image to upload
        in: formData
        name: file
        required: true
        type: file
      - description: Visibility of attachment
        in: formData
        name: visibility
        required: true
        type: string
      - description: Folder to upload attachment
        in: formData
        name: folder
        type: string
      - description: Width of image
        in: formData
        name: width
        type: integer
      - description: Height of image
        in: formData
        name: height
        type: integer
      - description: Compress image
        in: formData
        name: compress
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/command.UploadImageResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/outerr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/outerr.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/outerr.Response'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/outerr.Response'
        "413":
          description: Request entity too large
          schema:
            $ref: '#/definitions/outerr.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/outerr.Response'
      security:
      - ApiKeyAuth: []
      summary: Upload image attachment
      tags:
      - Attachments
  /auth/apple:
    post:
      consumes:
      - application/json
      description: Authenticate or register a user via Apple ID token
      parameters:
      - description: Apple ID token and optional profile fields
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/command.AppleSignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/command.AppleSignInResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/outerr.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/outerr.Response'
      summary: Apple Sign In
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user with email/phone and password
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/command.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/command.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/outerr.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/outerr.Response'
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Logout user (revokes all outstanding refresh tokens)
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/outerr.Response'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - Auth
