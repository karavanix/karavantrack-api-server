            $ref: '#/definitions/outerr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/outerr.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/outerr.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/outerr.Response'
      security:
      - BearerAuth: []
      summary: Create public cargo tracking link
      tags:
      - Loads
  /public/tracking/{token}:
    get:
      description: PUBLIC, unauthenticated snapshot of a load's status and latest
        known position, by tracking-link token
      parameters:
      - description: Tracking link token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/query.GetPublicTrackingResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/outerr.Response'
      summary: Get public cargo tracking snapshot
      tags:
      - Tracking
  /public/tracking/{token}/route:
    get:
      description: PUBLIC, unauthenticated route matched to roads, by tracking-link
        token (same shape as the authenticated GET /loads/{id}/route)
      parameters:
      - description: Tracking link token
        in: path
        name: token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/query.GetRouteResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/outerr.Response'
      summary: Get public cargo route
      tags:
      - Tracking
  /public/tracking/{token}/track:
    get:
      description: PUBLIC, unauthenticated location history for a load, by tracking-link
        token, oldest first (same shape as the authenticated GET /loads/{id}/track)
      parameters:
      - description: Tracking link token
        in: path
        name: token
        required: true
        type: string
      - description: Only points recorded after this time (RFC 3339), e.g. the route's
          matched_until or the newest point already shown
        in: query
        name: after
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/query.GetTrackResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/outerr.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/outerr.Response'
      summary: Get public cargo tracking history
      tags:
      - Tracking
  /routes/preview:
    get:
      description: 'Driving route between two points, e.g. pickup and drop-off while
        creating a load: geometry as polyline6, distance and estimated duration. Nothing
        is stored.'
      parameters:
      - description: Start point as lat,lng
        example: 41.311081,69.240562
        in: query
        name: from
        required: true
        type: string
      - description: End point as lat,lng
        example: 41.299496,69.240073
        in: query
        name: to
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/query.PreviewRouteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/outerr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/outerr.Response'
        "422":
          description: No road route between the points
          schema:
            $ref: '#/definitions/outerr.Response'
        "503":
          description: Routing engine unavailable
          schema:
            $ref: '#/definitions/outerr.Response'
      security:
      - BearerAuth: []
      summary: Preview a driving route
      tags:
      - Routes
  /users/carriers/by-contact:
    get:
      description: Get carrier user by contact
      parameters:
      - description: Email or Phone Number
        in: query
        name: contact
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/query.GetCarrierByContactResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/outerr.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/outerr.Response'
      security:
      - BearerAuth: []
      summary: Get carrier by contact
      tags:
      - Users
  /users/invite:
    post:
      description: Invite user
      parameters:
      - description: Invite user
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/command.InviteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/command.InviteResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/outerr.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/outerr.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/outerr.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/outerr.Response'
      security:
      - BearerAuth: []
      summary: Invite user
      tags:
      - Users
  /users/me:
    delete:
      description: Permanently deletes the authenticated user's account and all associated
        data
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/outerr.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/outerr.Response'
      security:
      - BearerAuth: []
      summary: Delete current user
      tags:
      - Users
    get:
      description: Get the profile of the authenticated user (includes role)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/query.MeResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/outerr.Response'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - Users
    put:
      consumes:
      - application/json
      description: Update the profile of the authenticated user
      parameters:
      - description: Update User Request
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_karavanix_karavantrack-api-server_internal_usecase_users_command.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/outerr.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/outerr.Response'
      security:
      - BearerAuth: []
      summary: Update current user
      tags:
      - Users
  /users/me/devices:
    post:
      consumes:
      - application/json
      description: Register or update a device for push notifications
      parameters:
      - description: Device registration
        in: body
        name: body
