<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подтверждение email — Yool</title>
  <style>
    @media only screen and (max-width: 480px) {
      .email-wrapper { padding: 24px 12px !important; }
      .email-body    { padding: 28px 20px 20px !important; }
      .email-header  { padding: 20px !important; }
      .email-footer  { padding: 14px 20px !important; }
      .code-text     { font-size: 26px !important; letter-spacing: 8px !important; }
    }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f6f8fa;font-family:Arial,sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" class="email-wrapper" style="background-color:#f6f8fa;padding:48px 16px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#ffffff;border-radius:10px;border:1px solid #e4e7ec;">

          <!-- Шапка -->
          <tr>
            <td class="email-header" style="padding:24px 32px;border-bottom:1px solid #e4e7ec;">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td><span style="font-size:17px;font-weight:600;color:#0d1117;letter-spacing:-0.3px;">Yool</span></td>
                  <td align="right"><span style="font-size:12px;color:#9ca3af;">no-reply@yool.app</span></td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Основной блок -->
          <tr>
            <td class="email-body" style="padding:36px 32px 28px;">

              <!-- Иконка -->
              <div style="width:40px;height:40px;border-radius:50%;background-color:#eff6ff;margin-bottom:20px;text-align:center;line-height:40px;">
                <span style="font-size:18px;">✉️</span>
              </div>

              <p style="margin:0 0 6px;font-size:16px;font-weight:600;color:#0d1117;">Подтвердите ваш email</p>
              <p style="margin:0 0 28px;font-size:14px;color:#6b7280;line-height:1.6;">
                Введите код ниже, чтобы завершить регистрацию. Код действителен в течение
                <strong style="color:#0d1117;font-weight:500;">{{.ExpiresInMinutes}} минут</strong>.
              </p>

              <!-- Блок с кодом -->
              <div style="background-color:#f6f8fa;border-radius:8px;border:1px solid #e4e7ec;padding:20px;text-align:center;margin-bottom:28px;">
                <span class="code-text" style="font-size:32px;font-weight:600;letter-spacing:12px;color:#0d1117;font-family:'Courier New',monospace;">{{.Code}}</span>
              </div>

              <p style="margin:0;font-size:13px;color:#9ca3af;line-height:1.5;">
                Не запрашивали это? Просто проигнорируйте письмо — никаких действий не требуется.
              </p>
            </td>
          </tr>

          <!-- Подвал -->
          <tr>
            <td class="email-footer" style="padding:16px 32px;border-top:1px solid #e4e7ec;">
              <p style="margin:0;font-size:12px;color:#9ca3af;text-align:center;">© 2026 Yool · Все права защищены</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
